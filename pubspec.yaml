name: workshop_management_system
description: "A new Flutter project."
publish_to: 'none' # Prevent accidental publishing

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  uuid: ^4.0.0
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  firebase_auth: ^5.5.3
  intl: ^0.20.2
  image_picker: ^0.8.7+4
  path: ^1.8.2
  firebase_storage: ^12.4.5
  csv: ^5.0.2
  pdf: ^3.10.4
  path_provider: ^2.1.2
  flutter_stripe: ^10.2.0
  open_file: ^3.3.2
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/workshop_logo.webp"

flutter:
  uses-material-design: true

  assets:
    - assets/images/workshop_logo.webp
    - assets/images/foreman.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
